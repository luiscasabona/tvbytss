services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      CATALOG_REFRESH_SECONDS: "43200"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      ON_AIR_DB: /data/on-air.sqlite3
    volumes:
      - onair-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  onair-data:
  caddy-data:
  caddy-config:
